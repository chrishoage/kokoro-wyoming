# Builds the Home Assistant app image for each architecture and publishes a
# multi-arch manifest to GHCR. Pushes to master publish; pull requests only
# build. An image whose version tag already exists is not pushed again, so bump
# `version` in kokoro_wyoming/config.yaml to release.
name: Build app

on:
  push:
    branches: [master]
    paths:
      - "kokoro_wyoming/**"
      - ".github/workflows/build-app.yaml"
  pull_request:
    paths:
      - "kokoro_wyoming/**"
      - ".github/workflows/build-app.yaml"
  workflow_dispatch:

env:
  APP_DIR: kokoro_wyoming
  IMAGE_NAME: kokoro-wyoming

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
      version: ${{ steps.info.outputs.version }}
      publish: ${{ steps.info.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read app information
        id: info
        run: |
          config="${APP_DIR}/config.yaml"
          {
            echo "architectures=$(yq -o=json -I=0 '.arch' "${config}")"
            echo "name=$(yq '.name' "${config}")"
            echo "description=$(yq '.description' "${config}")"
            echo "version=$(yq '.version' "${config}")"
            echo "publish=${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # Push to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ github.server_url }}/${{ github.repository }}
          push: ${{ needs.prepare.outputs.publish }}
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Cosign signing
      packages: write # Push to GHCR
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          skip-existing: ${{ needs.prepare.outputs.version }}
