# https://developers.home-assistant.io/docs/apps/configuration/
name: Wyoming Kokoro TTS
version: "2.0.0"
slug: kokoro_wyoming
description: Local, high-quality text-to-speech with Kokoro via the Wyoming protocol
url: https://github.com/chrishoage/kokoro-wyoming/tree/master/kokoro_wyoming
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
discovery:
  - wyoming
ports:
  "10200/tcp": null
watchdog: tcp://[HOST]:[PORT:10200]
options:
  voice: af_heart
  speed: 1.0
  cache_size: 128
  debug: false
schema:
  voice: >-
    list(af_alloy|af_aoede|af_bella|af_heart|af_jessica|af_kore|af_nicole|af_nova|af_river|af_sarah|af_sky|am_adam|am_echo|am_eric|am_fenrir|am_liam|am_michael|am_onyx|am_puck|am_santa|bf_alice|bf_emma|bf_isabella|bf_lily|bm_daniel|bm_fable|bm_george|bm_lewis|ef_dora|em_alex|em_santa|ff_siwis|hf_alpha|hf_beta|hm_omega|hm_psi|if_sara|im_nicola|jf_alpha|jf_gongitsune|jf_nezumi|jf_tebukuro|jm_kumo|pf_dora|pm_alex|pm_santa|zf_xiaobei|zf_xiaoni|zf_xiaoxiao|zf_xiaoyi|zm_yunjian|zm_yunxi|zm_yunxia|zm_yunyang)
  speed: float(0.5,2.0)
  cache_size: int(0,)
  debug: bool
# Uncomment once the "Build app" workflow has published an image, so Home
# Assistant pulls it instead of building (and downloading the model) on-device.
# image: ghcr.io/chrishoage/kokoro-wyoming
